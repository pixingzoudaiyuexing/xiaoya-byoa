name: Test Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  byoa-test:
    name: Test BYOA MVP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Test BYOA core
        run: |
          set -e
          go test ./internal/byoa -count=1
          go test ./server/common -run '^TestErrorRespConvertsBYOAAuthError$' -count=1
          go test ./drivers/quark_uc_share -run '^TestQuarkBYOARequiresBrowserCredential$' -count=1
          go test ./drivers/aliyundrive_share2_open -run '^TestAliyunBYOARequiresBrowserCredential$' -count=1

  build:
    needs: byoa-test
    strategy:
      matrix:
        target:
          - linux-arm64-musl
          - linux-amd64-musl
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        uses: OpenListTeam/cgo-actions@v1.2.5
        with:
          targets: ${{ matrix.target }}
          flags: ${{ contains(matrix.target, '-musl') && '-ldflags=-linkmode external -extldflags ''-static -fpic''' || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist$ext

      - name: Verify musl binary is static
        if: contains(matrix.target, '-musl')
        run: |
          set -e
          if readelf -l build/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/openlist"
            readelf -l build/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Smoke build and run Xiaoya runtime image
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          mkdir -p build/linux/amd64
          cp build/openlist build/linux/amd64/alist
          docker build \
            --build-arg TARGETPLATFORM=linux/amd64 \
            -f Dockerfile.ci \
            -t xiaoya-byoa:ci .

          echo '=== Xiaoya runtime layout ==='
          docker run --rm --entrypoint sh xiaoya-byoa:ci -c '
            set -e
            ls -ld /data /www/data /opt/alist/data 2>/dev/null || true
            printf "/data -> "; readlink -f /data 2>/dev/null || true
            printf "/opt/alist/data -> "; readlink -f /opt/alist/data 2>/dev/null || true
          '

          data_volume="xiaoya-byoa-ci-data"
          docker volume create "$data_volume" >/dev/null
          cleanup() {
            docker logs xiaoya-byoa-ci 2>/dev/null || true
            docker rm -f xiaoya-byoa-ci >/dev/null 2>&1 || true
            docker volume rm -f "$data_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo '=== Xiaoya tokenless BYOA bootstrap ==='
          docker run --rm \
            -e BYOA_XIAOYA_STRICT=true \
            -e BYOA_XIAOYA_UPDATE=if-missing \
            -v "$data_volume:/opt/alist/data" \
            --entrypoint /byoa-xiaoya-bootstrap.sh \
            xiaoya-byoa:ci

          echo '=== Storage counts after BYOA normalization ==='
          docker run --rm \
            -v "$data_volume:/opt/alist/data" \
            --entrypoint sqlite3 \
            xiaoya-byoa:ci \
            /opt/alist/data/data.db \
            "select driver, count(*) from x_storages group by driver order by driver;"

          ali_count="$(docker run --rm \
            -v "$data_volume:/opt/alist/data" \
            --entrypoint sqlite3 \
            xiaoya-byoa:ci \
            /opt/alist/data/data.db \
            "select count(*) from x_storages where driver='AliyunShare';")"
          quark_count="$(docker run --rm \
            -v "$data_volume:/opt/alist/data" \
            --entrypoint sqlite3 \
            xiaoya-byoa:ci \
            /opt/alist/data/data.db \
            "select count(*) from x_storages where driver='QuarkShare';")"
          legacy_count="$(docker run --rm \
            -v "$data_volume:/opt/alist/data" \
            --entrypoint sqlite3 \
            xiaoya-byoa:ci \
            /opt/alist/data/data.db \
            "select count(*) from x_storages where driver in ('AliyundriveShare','AliyundriveShare2Open','AliyundriveShare2Pan115','115 Share','115 Cloud','UCShare','PikPakShare','PikPak');")"

          echo "AliyunShare storages: $ali_count"
          echo "QuarkShare storages: $quark_count"
          echo "Legacy/account-bound storages: $legacy_count"
          test "$ali_count" -gt 0
          test "$quark_count" -gt 0
          test "$legacy_count" -eq 0

          container_id="$(docker run -d \
            --name xiaoya-byoa-ci \
            -e BYOA_XIAOYA_UPDATE=if-missing \
            -v "$data_volume:/opt/alist/data" \
            -p 15244:5244 \
            xiaoya-byoa:ci)"

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15244/ping | grep -q 'pong'; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$container_id" 2>/dev/null | grep -q true; then
              echo 'Xiaoya BYOA container exited before health check passed'
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Xiaoya BYOA /ping health check timed out'
            exit 1
          fi
          echo 'Xiaoya BYOA runtime health check passed'

          echo '=== Guest root catalog without any BYOA credential ==='
          guest_body="$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"path":"/","password":"","page":1,"per_page":0,"refresh":false}' \
            http://127.0.0.1:15244/api/fs/list)"
          GUEST_BODY="$guest_body" python3 - <<'PY'
          import json
          import os

          body = json.loads(os.environ["GUEST_BODY"])
          assert body.get("code") == 200, body
          content = (body.get("data") or {}).get("content") or []
          assert len(content) > 0, body
          print(f"Guest catalog entries: {len(content)}")
          print("Guest root names:", ", ".join(x.get("name", "") for x in content[:20]))
          PY

          echo '=== Anonymous provider catalog checks ==='
          docker exec xiaoya-byoa-ci sqlite3 /opt/alist/data/data.db \
            "select mount_path from x_storages where driver='AliyunShare' order by id limit 8;" \
            > /tmp/ali_paths.txt
          docker exec xiaoya-byoa-ci sqlite3 /opt/alist/data/data.db \
            "select mount_path from x_storages where driver='QuarkShare' order by id limit 6;" \
            > /tmp/quark_paths.txt

          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          endpoint = "http://127.0.0.1:15244/api/fs/list"

          def list_path(path):
              payload = json.dumps({
                  "path": path,
                  "password": "",
                  "page": 1,
                  "per_page": 0,
                  "refresh": False,
              }, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          def verify_provider(provider, filename):
              with open(filename, "r", encoding="utf-8") as handle:
                  paths = [line.strip() for line in handle if line.strip()]
              assert paths, f"{provider}: no storage mount paths"

              failures = []
              for path in paths:
                  try:
                      body = list_path(path)
                      content = (body.get("data") or {}).get("content") or []
                      if body.get("code") == 200 and content:
                          print(f"{provider} anonymous list passed: {path} ({len(content)} entries)")
                          print(f"{provider} sample: " + ", ".join(x.get("name", "") for x in content[:5]))
                          return
                      failures.append(f"{path}: code={body.get('code')} message={body.get('message')} entries={len(content)}")
                  except Exception as exc:
                      failures.append(f"{path}: {type(exc).__name__}: {exc}")
              raise AssertionError(provider + " anonymous list failed: " + " | ".join(failures))

          # urllib opener carries no Cookie jar and sends no BYOA credentials.
          verify_provider("AliyunShare", "/tmp/ali_paths.txt")
          verify_provider("QuarkShare", "/tmp/quark_paths.txt")
          PY

          docker rm -f xiaoya-byoa-ci >/dev/null
          trap - EXIT
          docker volume rm -f "$data_volume" >/dev/null
          rm -rf build/linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openlist_${{ steps.short-sha.outputs.sha }}_${{ matrix.target }}
          path: build/*
