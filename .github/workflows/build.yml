name: Test Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  byoa-test:
    name: Test BYOA MVP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Prepare embedded frontend stub
        run: |
          set -e
          mkdir -p public/dist
          printf '%s\n' '<!doctype html><html><body><!-- customize body --></body></html>' > public/dist/index.html

      - name: Test BYOA core
        run: |
          set -e
          go test ./internal/byoa -count=1
          go test ./server/common -run 'BYOA' -count=1
          go test ./server/static -run '^TestBYOA' -count=1
          go test ./server/middlewares -run '^TestBYOAIPRateLimiterBurstAndRefill$' -count=1
          go test ./drivers/quark_uc_share -run '^TestQuarkBYOARequiresBrowserCredential$' -count=1
          go test ./drivers/aliyundrive_share2_open -run '^TestAliyunBYOARequiresBrowserCredential$' -count=1

      - name: Validate BYOA deployment files
        run: |
          set -e
          sh -n entrypoint.sh
          sh -n scripts/byoa-xiaoya-bootstrap.sh
          sh -n scripts/byoa-xiaoya-normalize.sh
          docker compose -f docker-compose.byoa.yml config >/dev/null

  build:
    needs: byoa-test
    strategy:
      matrix:
        target:
          - linux-arm64-musl
          - linux-amd64-musl
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.4"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        uses: OpenListTeam/cgo-actions@v1.2.5
        with:
          targets: ${{ matrix.target }}
          flags: ${{ contains(matrix.target, '-musl') && '-ldflags=-linkmode external -extldflags ''-static -fpic''' || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@openlist.team>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist$ext

      - name: Verify musl binary is static
        if: contains(matrix.target, '-musl')
        run: |
          set -e
          if readelf -l build/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/openlist"
            readelf -l build/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Prepare amd64 runtime image
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          mkdir -p build/linux/amd64
          cp build/openlist build/linux/amd64/alist
          docker build \
            --build-arg TARGETPLATFORM=linux/amd64 \
            -f Dockerfile.ci \
            -t xiaoya-byoa:ci .

          echo '=== Xiaoya runtime layout ==='
          docker run --rm --entrypoint sh xiaoya-byoa:ci -c '
            set -e
            ls -ld /data /www/data /opt/alist/data 2>/dev/null || true
            printf "/data -> "; readlink -f /data 2>/dev/null || true
            printf "/opt/alist/data -> "; readlink -f /opt/alist/data 2>/dev/null || true
          '

      - name: Probe fresh OpenList runtime
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          probe_openlist() {
            probe_name="$1"
            shift
            docker rm -f "$probe_name" >/dev/null 2>&1 || true
            docker run -d \
              --name "$probe_name" \
              --entrypoint /opt/alist/alist \
              xiaoya-byoa:ci \
              "$@" >/dev/null
            sleep 3
            echo "=== ${probe_name} state ==="
            docker inspect -f 'Running={{.State.Running}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' "$probe_name" || true
            echo "=== ${probe_name} logs ==="
            docker logs "$probe_name" 2>&1 || true
            if [ "$(docker inspect -f '{{.State.Running}}' "$probe_name" 2>/dev/null || true)" = "true" ]; then
              docker rm -f "$probe_name" >/dev/null
              return 0
            fi
            docker rm -f "$probe_name" >/dev/null 2>&1 || true
            return 1
          }

          echo '=== Probe OpenList against a completely fresh data directory ==='
          fresh_plain=0
          fresh_no_prefix=0
          probe_openlist byoa-probe-fresh-plain server --data /tmp/openlist-fresh-plain --debug --log-std || fresh_plain=$?
          probe_openlist byoa-probe-fresh-noprefix server --data /tmp/openlist-fresh-noprefix --debug --log-std --no-prefix || fresh_no_prefix=$?
          echo "Fresh probe rc: plain=${fresh_plain} no-prefix=${fresh_no_prefix}"
          if [ "$fresh_plain" -ne 0 ] || [ "$fresh_no_prefix" -ne 0 ]; then
            echo "Fresh OpenList runtime probe failed: plain=${fresh_plain} no-prefix=${fresh_no_prefix}" >&2
            exit 1
          fi

      - name: Bootstrap Xiaoya runtime fixture
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          diag_volume="xiaoya-byoa-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume rm -f "$diag_volume" >/dev/null 2>&1 || true
          docker volume create "$diag_volume" >/dev/null
          docker run --rm \
            --entrypoint sh \
            -e BYOA_XIAOYA_STRICT=true \
            -e BYOA_XIAOYA_UPDATE=if-newer \
            -v "$diag_volume:/opt/alist/data" \
            xiaoya-byoa:ci \
            -c '/byoa-xiaoya-bootstrap.sh'

      - name: Normalize Xiaoya runtime fixture
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          diag_volume="xiaoya-byoa-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm \
            --entrypoint sh \
            -e BYOA_XIAOYA_STRICT=true \
            -v "$diag_volume:/opt/alist/data" \
            xiaoya-byoa:ci \
            -c '
              set -e
              echo "=== Xiaoya DB metadata before normalize ==="
              ls -ld /opt/alist/data
              ls -l /opt/alist/data/data.db
              sqlite3 /opt/alist/data/data.db "PRAGMA integrity_check; PRAGMA user_version; SELECT name FROM sqlite_master WHERE type=\"table\" ORDER BY name;"
              /byoa-xiaoya-normalize.sh
              echo "=== Xiaoya DB metadata after normalize ==="
              ls -l /opt/alist/data/data.db
              sqlite3 /opt/alist/data/data.db "PRAGMA integrity_check; PRAGMA user_version; SELECT name FROM sqlite_master WHERE type=\"table\" ORDER BY name;"
            '

      - name: Probe Xiaoya OpenList startup
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          diag_volume="xiaoya-byoa-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f byoa-probe-xiaoya >/dev/null 2>&1 || true
          docker run -d \
            --name byoa-probe-xiaoya \
            --entrypoint /opt/alist/alist \
            -v "$diag_volume:/opt/alist/data" \
            xiaoya-byoa:ci \
            server --data /opt/alist/data --debug --log-std --no-prefix >/dev/null
          sleep 3

          echo '=== byoa-probe-xiaoya state ==='
          docker inspect -f 'Running={{.State.Running}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' byoa-probe-xiaoya || true

          # Capture only schema and migration/error diagnostics. Never persist raw runtime logs.
          {
            echo '=== SQLite schema metadata (DDL only; no row values) ==='
            docker run --rm \
              --entrypoint sqlite3 \
              -v "$diag_volume:/opt/alist/data" \
              xiaoya-byoa:ci \
              /opt/alist/data/data.db \
              "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" || true
            echo '=== Filtered OpenList startup diagnostics ==='
            docker logs byoa-probe-xiaoya 2>&1 \
              | grep -Ei 'migrat|sqlite|database|table|column|constraint|duplicate|no such|error|fail|alter|create|panic|fatal' \
              | sed -E \
                  -e 's/(access[_-]?token|refresh[_-]?token|authorization|bearer|cookie|credential|password|secret)([=: ]+)[^ ,;\"]+/\1\2[REDACTED]/Ig' \
                  -e 's/[A-Za-z0-9_\/.+-]{48,}/[REDACTED_LONG_VALUE]/g' \
              || true
          } > /tmp/openlist-migration-diagnostic.txt

          cat /tmp/openlist-migration-diagnostic.txt

          if [ "$(docker inspect -f '{{.State.Running}}' byoa-probe-xiaoya 2>/dev/null || true)" != "true" ]; then
            echo 'Xiaoya OpenList startup probe failed' >&2
            exit 1
          fi
          docker rm -f byoa-probe-xiaoya >/dev/null

      - name: Upload sanitized migration diagnostic
        if: always() && matrix.target == 'linux-amd64-musl'
        uses: actions/upload-artifact@v7
        with:
          name: openlist-migration-diagnostic
          path: /tmp/openlist-migration-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup Xiaoya diagnostic volume
        if: always() && matrix.target == 'linux-amd64-musl'
        run: |
          docker rm -f byoa-probe-xiaoya >/dev/null 2>&1 || true
          docker volume rm -f "xiaoya-byoa-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true

      - name: Smoke persistent Xiaoya BYOA runtime
        if: matrix.target == 'linux-amd64-musl'
        run: |
          set -e
          : > /tmp/byoa-docker-events.log
          docker events \
            --filter 'container=xiaoya-byoa-ci' \
            --format '{{json .}}' \
            > /tmp/byoa-docker-events.log 2>&1 &
          docker_events_pid=$!

          set +e
          bash scripts/ci/byoa-runtime-smoke.sh xiaoya-byoa:ci
          smoke_status=$?
          set -e

          kill "$docker_events_pid" >/dev/null 2>&1 || true
          wait "$docker_events_pid" >/dev/null 2>&1 || true

          if [ "$smoke_status" -ne 0 ]; then
            echo '=== Docker lifecycle events ==='
            cat /tmp/byoa-docker-events.log || true
            echo "Smoke exit status: ${smoke_status}"
            exit "$smoke_status"
          fi

          rm -rf build/linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openlist_${{ steps.short-sha.outputs.sha }}_${{ matrix.target }}
          path: build/*
